<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151312" />
<title>Heartfood — food, reachable</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark">&#10084;</span>
        <span class="brand-name">Heartfood</span>
      </div>
      <span class="brand-tag">Greater Hartford</span>
    </header>

    <main id="thread" class="thread" aria-live="polite">
      <!-- messages injected by app.js -->
    </main>

    <div id="chips" class="chips"></div>

    <form id="composer" class="composer">
      <button type="button" id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my location">
        &#128205;
      </button>
      <input
        id="composer-input"
        type="text"
        autocomplete="off"
        placeholder="I don't have a car, I'm near Park St…"
      />
      <button type="submit" class="send-btn" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
