<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Heartfood logo">
  <defs>
    <symbol id="brick" viewBox="0 0 18 18">
      <rect x="1" y="1" width="16" height="16" rx="3.2" fill="#ff6b57" stroke="#c94a3a" stroke-width="0.6"/>
      <rect x="3.3" y="3" width="9" height="3.6" rx="1.8" fill="#ffffff" opacity="0.24"/>
      <circle cx="9" cy="1.4" r="2.9" fill="#ffb35a" stroke="#c94a3a" stroke-width="0.7"/>
    </symbol>
  </defs>

  <!-- Hartford-inspired badge silhouette (stylized, not a literal map trace) -->
  <path d="M100,14 C132,14 158,26 172,47 C186,68 188,94 180,118
           C173,140 158,159 134,172 C113,184 88,186 65,177
           C40,167 20,148 13,122 C7,99 13,72 31,52
           C48,33 71,16 100,14 Z"
        fill="#20140f" stroke="#ff6b57" stroke-width="4"/>

  <!-- Connecticut River cue, curving through the badge -->
  <path d="M18,130 Q66,108 100,128 T182,114"
        fill="none" stroke="#8fc1d9" stroke-width="4.5" stroke-linecap="round" opacity="0.32"/>

  <!-- LEGO-brick heart, 5x5 pixel-heart pattern -->
  <g>
    <use href="#brick" x="73"  y="60"  width="18" height="18"/>
    <use href="#brick" x="109" y="60"  width="18" height="18"/>

    <use href="#brick" x="55"  y="78"  width="18" height="18"/>
    <use href="#brick" x="73"  y="78"  width="18" height="18"/>
    <use href="#brick" x="91"  y="78"  width="18" height="18"/>
    <use href="#brick" x="109" y="78"  width="18" height="18"/>
    <use href="#brick" x="127" y="78"  width="18" height="18"/>

    <use href="#brick" x="55"  y="96"  width="18" height="18"/>
    <use href="#brick" x="73"  y="96"  width="18" height="18"/>
    <use href="#brick" x="91"  y="96"  width="18" height="18"/>
    <use href="#brick" x="109" y="96"  width="18" height="18"/>
    <use href="#brick" x="127" y="96"  width="18" height="18"/>

    <use href="#brick" x="73"  y="114" width="18" height="18"/>
    <use href="#brick" x="91"  y="114" width="18" height="18"/>
    <use href="#brick" x="109" y="114" width="18" height="18"/>

    <use href="#brick" x="91"  y="132" width="18" height="18"/>
  </g>
</svg>
