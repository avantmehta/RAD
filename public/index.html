<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#151312" />
<title>Heartfood — food, reachable</title>
<link rel="icon" href="logo.svg" type="image/svg+xml" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <img class="brand-mark" src="logo.svg" alt="Heartfood logo" width="30" height="30" />
        <span class="brand-name">Heartfood</span>
      </div>
      <span class="brand-tag">&#128205; Greater Hartford</span>
    </header>

    <div id="status" class="status">&#128075; Tap your answers below, or just tell me what's up.</div>

    <div id="filters" class="filters">
      <!-- prompt button-groups injected by app.js from the PROMPTS config -->
    </div>

    <main id="results" class="results-area" aria-live="polite">
      <!-- result cards injected by app.js -->
    </main>

    <form id="composer" class="composer">
      <button type="button" id="locate-btn" class="icon-btn" title="Use my location" aria-label="Use my location">
        &#128205;
      </button>
      <input
        id="composer-input"
        type="text"
        autocomplete="off"
        placeholder="Anything else? e.g. near Park St, no car…"
      />
      <button type="submit" class="send-btn" aria-label="Send">&#10148;</button>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
