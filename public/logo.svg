<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Heartfood logo">
  <!--
    Outline is a stylized homage to Hartford's Phoenix Mutual building
    (the "boat building") — its famous pointed, lens-shaped silhouette —
    not a precise architectural trace. The heart inside is a plain,
    literal heart symbol.
  -->

  <!-- Phoenix Building silhouette: a pointed lens/vesica shape (sharp
       cusps top & bottom, smooth round bulge at the sides) -->
  <path d="M100,15
           C115,40 162,60 162,100
           C162,140 115,160 100,185
           C85,160 38,140 38,100
           C38,60 85,40 100,15 Z"
        fill="#1c1416" stroke="#ff9eb0" stroke-width="5"/>

  <!-- faint mullion lines for a "glass building" cue -->
  <path d="M78,24 C68,48 64,150 78,176" fill="none" stroke="#aeefda" stroke-width="1.4" opacity="0.35"/>
  <path d="M122,24 C132,48 136,150 122,176" fill="none" stroke="#aeefda" stroke-width="1.4" opacity="0.35"/>

  <!-- literal heart symbol -->
  <path transform="translate(42.4,41.56) scale(4.8)"
        d="M12,21.35 L10.55,20.03 C5.4,15.36 2,12.28 2,8.5
           C2,5.42 4.42,3 7.5,3 C9.24,3 10.91,3.81 12,5.09
           C13.09,3.81 14.76,3 16.5,3 C19.58,3 22,5.42 22,8.5
           C22,12.28 18.6,15.36 13.45,20.03 L12,21.35 Z"
        fill="#ff6f91"/>
  <path transform="translate(42.4,41.56) scale(4.8)"
        d="M7.7,4.6 C6,4.6 4.6,6 4.6,7.7 C4.6,8.9 5.4,10.3 6.6,11.7"
        fill="none" stroke="#ffd5dc" stroke-width="0.9" stroke-linecap="round" opacity="0.55"/>
</svg>
